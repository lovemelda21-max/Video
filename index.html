<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience Fullscreen Video</title>
    <style>
        /* CSS Reset & Modern Box-Sizing */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Wrapper Premium dengan Ambient Glow Effect */
        .wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }

        /* Link Fullscreen */
        .fullscreen-link {
            position: relative;
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
            cursor: pointer;
        }

        /* Video dengan Efek Transisi & Scale Halus */
        .fullscreen-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 0;
            transform: scale(1.05);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity;
        }

        /* Kelas ketika video sudah siap/dimuat */
        .fullscreen-video.loaded {
            opacity: 1;
            transform: scale(1);
        }

        /* Efek Hover Premium (Zoom halus saat kursor diarahkan ke video) */
        .fullscreen-link:hover .fullscreen-video {
            transform: scale(1.02);
        }

        /* Lapisan Gradasi Halus di Pinggir (Vignette & Depth) */
        .wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            z-index: 2;
        }

        /* Indikator Interaksi Halus di Pojok (Opsional untuk kesan interaktif) */
        .pulse-badge {
            position: absolute;
            bottom: 24px;
            right: 24px;
            z-index: 3;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
            }
            70% {
                box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <a href="https://securedeal.pro/a/xkoMRFQ7ZqhA6Jq" class="fullscreen-link" target="_blank" rel="noopener noreferrer">
            <!-- Ganti sumber video (src) dengan file video Anda -->
            <video 
                src="02mU8Rk1XdhhQqBQ.mp4" 
                class="fullscreen-video" 
                id="heroVideo" 
                autoplay 
                muted 
                loop 
                playsinline>
            </video>
            
            <!-- Indikator Estetik Modern -->
            <div class="pulse-badge">
                <span class="pulse-dot"></span>
                <span>Ketuk untuk Melanjutkan</span>
            </div>
        </a>
    </div>

    <script>
        // Skrip untuk memastikan transisi fade-in berjalan mulus setelah video siap dimainkan
        const video = document.getElementById('heroVideo');
        
        // Menggunakan event 'loadeddata' atau 'canplay' agar transisi berjalan saat video siap
        if (video.readyState >= 3) {
            video.classList.add('loaded');
        } else {
            video.addEventListener('canplay', () => {
                video.classList.add('loaded');
            }, { once: true });
        }
    </script>

</body>
</html>
